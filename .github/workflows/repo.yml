name: Update Repo Index

on:
  push:
    paths:
      - 'debs/**.deb'
      - 'Release'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate Packages index
        run: |
          rm -f Packages Packages.gz
          for deb in debs/*.deb; do
            [ -f "$deb" ] || continue
            echo "Processing $(basename "$deb")..."
            size=$(wc -c < "$deb" | tr -d ' ')
            sha256=$(sha256sum "$deb" | awk '{print $1}')
            filename="debs/$(basename "$deb")"
            for field in Package Name Version Architecture Description Author Maintainer Section Depends Homepage; do
              val=$(dpkg-deb --field "$deb" "$field" 2>/dev/null)
              [ -n "$val" ] && echo "$field: $val" >> Packages
            done
            echo "Filename: $filename" >> Packages
            echo "Size: $size"         >> Packages
            echo "SHA256: $sha256"     >> Packages
            echo ""                    >> Packages
          done
          gzip -k9 Packages

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz
          git diff --staged --quiet && echo "No changes" || {
            git commit -m "auto: update Packages index [skip ci]"
            git push
          }
